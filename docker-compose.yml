services:
  db:
    image: postgres:17
    container_name: notes_together_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - notes_postgres_data:/var/lib/postgresql/data

volumes:
  notes_postgres_data: